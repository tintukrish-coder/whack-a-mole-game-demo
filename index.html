<!DOCTYPE HTML>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Whack-A-Creeper | Minecraft Edition</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<script src="./js/phaser.min.js"></script>
	<script src="./js/gameConfig.js"></script>
	<script src="./js/GameBoot.js"></script>
	<script src="./js/GameLoadingScreen.js"></script>
	<script src="./js/GamePlay.js"></script>
	<style type="text/css">
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #78A7FF;
			font-family: 'Press Start 2P', monospace;
		}

		#gameContainer {
			width: 100%;
			height: 100%;
		}

		canvas {
			display: block;
			touch-action: none;
			user-select: none;
			-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
			cursor: crosshair;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}
	</style>
</head>

<body>

	<div id="gameContainer"></div>

	<script type="text/javascript">
		window.onload = function() {
			var game = new Phaser.Game(
				gameConfig.width,
				gameConfig.height,
				Phaser.AUTO,
				'gameContainer',
				false,
				false,
				false
			);
			game.state.add('GameBoot', MainGameContainer.GameBoot);
			game.state.add('GameLoadingScreen', MainGameContainer.GameLoadingScreen);
			game.state.add('GamePlay', MainGameContainer.GamePlay);

			game.state.start('GameBoot');
		};
	</script>

</body>

</html>
