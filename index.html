<!DOCTYPE HTML>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<title>Whack-A-Creeper | Minecraft Edition</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<script src="./js/phaser.min.js"></script>
	<script src="./js/gameConfig.js"></script>
	<script src="./js/GameBoot.js"></script>
	<script src="./js/GameLoadingScreen.js"></script>
	<script src="./js/GamePlay.js"></script>
	<style type="text/css">
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #78A7FF;
			font-family: 'Press Start 2P', monospace;
		}

		#gameContainer {
			position: relative;
			width: 100%;
			height: 100%;
		}

		canvas {
			display: block;
			position: absolute;
			touch-action: none;
			user-select: none;
			-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
			cursor: crosshair;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			transform-origin: top left;
		}
	</style>
</head>

<body>

	<div id="gameContainer"></div>

	<script type="text/javascript">
		var GAME_W = 360;
		var GAME_H = 640;
		var _game  = null;

		function scaleGame() {
			var canvas = document.querySelector('#gameContainer canvas');
			if (!canvas) return;

			var scaleX = window.innerWidth  / GAME_W;
			var scaleY = window.innerHeight / GAME_H;
			var scale  = Math.min(scaleX, scaleY);

			var offsetX = Math.floor((window.innerWidth  - GAME_W * scale) / 2);
			var offsetY = Math.floor((window.innerHeight - GAME_H * scale) / 2);

			canvas.style.transform = 'scale(' + scale + ')';
			canvas.style.left = offsetX + 'px';
			canvas.style.top  = offsetY + 'px';

			// Tell Phaser the input scale so click coordinates map correctly
			// to game coordinates after the CSS transform is applied.
			if (_game && _game.input) {
				_game.input.scale.setTo(1 / scale, 1 / scale);
			}
		}

		window.addEventListener('resize', scaleGame);

		window.onload = function() {
			_game = new Phaser.Game(
				GAME_W,
				GAME_H,
				Phaser.AUTO,
				'gameContainer',
				false,
				false,
				false
			);
			_game.state.add('GameBoot', MainGameContainer.GameBoot);
			_game.state.add('GameLoadingScreen', MainGameContainer.GameLoadingScreen);
			_game.state.add('GamePlay', MainGameContainer.GamePlay);

			_game.state.start('GameBoot');

			// Poll until Phaser creates the canvas, then apply scaling
			var attempts = 0;
			var poll = setInterval(function() {
				attempts++;
				if (document.querySelector('#gameContainer canvas') || attempts > 40) {
					clearInterval(poll);
					scaleGame();
				}
			}, 100);
		};
	</script>

</body>

</html>
